name: Sync TDU rates

# Drop this into a repo that vendors tdsp_charges.csv. When the canonical copy in
# tdu-rates moves, this commits it straight to main, which is what makes the new
# rate deploy on its own.
#
# There is no review step by design. The gate is upstream: tdu-rates cross-checks
# the PUCT rate report PDFs against the rates page, reconciles both against PUCT's
# own published average bill, and refuses to publish anything that disagrees. The
# realistic failure without this job is not a wrong rate, it is a stale one.
#
# Fires three ways:
#   repository_dispatch  the push from tdu-rates, arrives within seconds
#   schedule             a safety net in case the dispatch never lands
#   workflow_dispatch    manual
#
# If tdu-rates is private, add a read token as a secret and send it with the curl:
#   -H "Authorization: Bearer ${{ secrets.TDU_RATES_TOKEN }}"

on:
  repository_dispatch:
    types: [tdu-rates-updated]
  schedule:
    - cron: "45 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdu-rates-sync
  cancel-in-progress: false

env:
  CANONICAL: https://raw.githubusercontent.com/meeradahyabhai-code/tdu-rates/main/data/tdsp_charges.csv
  LOCAL: data/static/tdsp_charges.csv

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the canonical CSV
        run: curl --fail-with-body -sSL "$CANONICAL" -o /tmp/canonical.csv

      # Committing straight to main means nobody eyeballs this first, so the
      # checks below are the last line of defence. A 404 page or a truncated
      # download must never land on top of real rates.
      - name: Sanity-check what we fetched
        run: |
          head -1 /tmp/canonical.csv | grep -qx 'utility,monthly,perKwh,startDate,endDate' \
            || { echo "unexpected header:"; head -3 /tmp/canonical.csv; exit 1; }
          lines=$(wc -l < /tmp/canonical.csv)
          [ "$lines" -ge 100 ] || { echo "only $lines lines, expected 100+"; exit 1; }
          for u in ONCOR CNP AEPCC AEPNC TNMP; do
            grep -q "^$u," /tmp/canonical.csv || { echo "no $u rows"; exit 1; }
          done
          # the local file is the floor: syncing should never lose history
          [ "$lines" -ge "$(wc -l < "$LOCAL")" ] || { echo "canonical is shorter than $LOCAL"; exit 1; }

      - id: diff
        name: Anything to sync
        run: |
          if cmp -s /tmp/canonical.csv "$LOCAL"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "tdu-rates sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/canonical.csv "$LOCAL"

          body=$(git diff --unified=0 -- "$LOCAL" | grep -E '^[+-][A-Z]' || true)
          printf 'TDU rates: sync from tdu-rates\n\n%s\n' "$body" > /tmp/msg
          git add "$LOCAL"
          git commit -F /tmp/msg
          git pull --rebase origin main
          git push origin HEAD:main

          {
            echo "### TDU rates updated and deploying"
            echo '```diff'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Confirm the rates that are live are the ones we just fetched, rather than
      # trusting that git push exiting 0 means the file landed.
      - name: Verify main now carries the new rates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git fetch -q origin main
          git show origin/main:"$LOCAL" > /tmp/on-main.csv
          cmp -s /tmp/on-main.csv /tmp/canonical.csv \
            || { echo "main does not match the canonical file after push"; exit 1; }
          echo "main matches the canonical file"
